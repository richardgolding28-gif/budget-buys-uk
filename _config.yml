title: Trail & Tarp
description: >-
  No-nonsense buying guides for budget and beginner camping gear —
  tents, sleeping bags, coolers, lights, and more.
baseurl: "/camp-gear-guide"
url: "https://richardgolding28-gif.github.io"

theme: minima
minima:
  skin: dark

# Amazon Associates tracking ID — every affiliate link on the site reads this value.
amazon_tag: "trailandtarp-20"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

header_pages:
  - about.md
  - disclosure.md

markdown: kramdown
permalink: /:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
